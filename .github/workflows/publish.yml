name: Publish dashboard

on:
  schedule:
    # Fallback only: GitHub fires these sporadically. The primary trigger is a timer on the owner's PC.
    # Offset from :00 because GitHub's scheduler is most congested at the top of the hour.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Rate-limit guard: however often this workflow is triggered, the weather APIs are called at most
  # once per MIN_GAP seconds. It checks the time of the last real deploy (github-pages deployments are
  # only created by the publish job, so skipped runs don't count and can't keep pushing the window out).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      deployments: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_GAP: "600"
        run: |
          last=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=1" --jq '.[0].created_at // empty')
          if [ -z "$last" ]; then
            echo "No previous deploy found"
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age=$(( $(date +%s) - $(date -d "$last" +%s) ))
          if [ "$age" -lt "$MIN_GAP" ]; then
            echo "::notice::Skipped: last deploy was ${age}s ago (minimum gap ${MIN_GAP}s)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last deploy ${age}s ago, building"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          LOC_BE: ${{ secrets.LOC_BE }}
          LOC_IT: ${{ secrets.LOC_IT }}
          LOC_EE: ${{ secrets.LOC_EE }}
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: python build_site.py --out _site

      - uses: actions/configure-pages@v5

      # Minimum retention allowed by GitHub Actions (1 day) to limit exposure
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

      - uses: actions/deploy-pages@v4
